name: Check an existing Mac disk image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the disk image
        required: true
      runner_image:
        type: choice
        options: [macos-26, macos-15, macos-26-intel, macos-15-intel]
        default: macos-26
      force_cpu_renderer:
        type: boolean
        default: false
      web_diagnostics:
        type: boolean
        default: false
      arch:
        type: choice
        options: [arm64, x86_64]
        default: arm64

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: Snorca_MultiAce_Mac_${{ inputs.arch }}_*
          merge-multiple: true
          path: dist
      - name: Fresh launch and connection-helper diagnostics
        env:
          FORCE_CPU_RENDERER: ${{ inputs.force_cpu_renderer }}
          WEB_DIAGNOSTICS: ${{ inputs.web_diagnostics }}
          PACKAGE_ARCH: ${{ inputs.arch }}
        run: bash scripts/check_macos_package.sh
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mac-${{ inputs.arch }}-package-check-${{ inputs.run_id }}
          path: package-test-results/
          if-no-files-found: error
